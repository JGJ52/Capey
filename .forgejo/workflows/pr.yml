name: PR Checks

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    if: forgejo.event.pull_request.head.repo.full_name == forgejo.repository
    runs-on: java
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: restore cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: build
        run: ./gradlew build